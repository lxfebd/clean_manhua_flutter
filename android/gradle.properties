org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# 关闭 Flutter Gradle 插件的自动 ABI 注入：插件默认会对 buildType 级
# abiFilters 做 clear() 后注入全平台（arm64-v8a/armeabi-v7a/x86_64），
# 覆盖 app/build.gradle.kts 里"release 仅 arm64"的配置（实测 APK 因此
# 达 56.3MB）。启用此开关后，插件跳过注入，由本仓库显式控制 ABI：
# release → 仅 arm64-v8a；debug → 全 ABI（模拟器可跑）。
# 官方文档见 FlutterPluginUtils.shouldProjectDisableAbiFiltering。
disable-abi-filtering=true
