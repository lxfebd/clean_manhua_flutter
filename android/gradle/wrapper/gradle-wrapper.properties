# 把构建机的执行权交给任何能控制这个 URL 响应的节点。升级 Gradle 时必须同步改
# 这个值（取官方 services.gradle.org/distributions/ 页公布的 SHA-256）。
distributionSha256Sum=89d4e70e4e84e2d2dfbb63e4daa53e21b25017cc70c37e4eea31ee51fb15098a
