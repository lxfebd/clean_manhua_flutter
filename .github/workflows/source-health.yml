name: Source Health (daily live contracts)

# P1-29（供应链）：所有第三方 Action 一律钉到** commit SHA**，不用可变的 major
# 标签。标签可被作者随时推移（action 仓库被入侵或作者作恶时，@v4 会静默变成
# 别人的代码），而这些 job 持有 contents:write / 读取 Secrets 的权限。升级方式是
# 改 SHA + 在注释里记录对应版本号。

# 为什么要有这个 workflow
# ----------------------
# verify_*_test.dart 是 10 个「真实网络契约」测试（每个源各一组：拉列表/详情/
# 章节/图片直链，断言页面结构没变；MangaDex 另有一组静态资源 UA 契约；再加 1 个
# 全源解析探测契约）。它们默认在
# 本地和 PR CI 里跳过
# （_skipLive = !bool.fromEnvironment('LIVE_SOURCE_TESTS')，未定义即跳过），
# 因为跑真网慢且不稳定，不该卡住每次提交。
#
# 但源站改版是静默的：契约不跑，CI 全绿，用户端才会「加载不出来」。
# 所以这里每天定时跑一次真网契约——它不阻塞发布，只负责「源坏了第一个知道」。
#
# 失败时的行为：重试一次（GitHub runner 访问国内站点偶发抖动，避免误报），
# 两次都失败才开/刷新一个 issue，带上运行链接和日期。

on:
  schedule:
    # 每天 18:30 UTC = 北京时间 02:30（低峰期，源站压力小）
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因（记入日志）'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: source-health
  cancel-in-progress: false

jobs:
  live-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（钉 commit SHA，P1-29）

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2（钉 commit SHA，P1-29）
        with:
          channel: stable
          flutter-version: '3.44.0'

      - name: Pub get
        run: flutter pub get

      - name: Run live source contracts (retry once)
        id: contracts
        run: |
          set -u
          TESTS="test/verify_anime1_test.dart test/verify_ashanyy_test.dart \
                 test/verify_biquge_test.dart test/verify_tvtfun_test.dart \
                 test/verify_wchedm_test.dart test/verify_xbiquge_test.dart \
                 test/verify_xifan_test.dart test/verify_mangadex_test.dart \
                 test/verify_mangadex_image_test.dart \
                 test/verify_source_parse_probe_test.dart"
          echo "触发原因: ${{ github.event.inputs.reason || '定时任务' }}"
          LOG=/tmp/contracts.log
          : > "$LOG"
          for attempt in 1 2; do
            echo "::group::attempt $attempt"
            if flutter test $TESTS --dart-define=LIVE_SOURCE_TESTS=true 2>&1 | tee -a "$LOG"; then
              echo "result=pass" >> "$GITHUB_OUTPUT"
              echo "verdict=clean" >> "$GITHUB_OUTPUT"
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            [ "$attempt" = "1" ] && sleep 20
          done

          # --- 分流：契约破坏 vs 不可达 ----------------------------------------
          # P1-30 要求 LIVE 模式下预探失败必须 fail（不准静默通过），所以这里仍然
          # 让 job 变红；但「不可达」不等于「契约被改」，不能每天开 issue——
          # 老逻辑不看原因就开 issue，等于用噪声报警、训练用户忽略警报。
          DRIFT=$(grep -cE 'Expected:|Actual:|Which:|应返回|解析为空|应为空' "$LOG" || true)
          echo "契约类失败行数: ${DRIFT:-0}"
          if [ "${DRIFT:-0}" -gt 0 ]; then
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "verdict=drift" >> "$GITHUB_OUTPUT"
            echo "::error::契约断言失败（绝非不可达类），开 issue"
            exit 1
          fi
          echo "result=fail" >> "$GITHUB_OUTPUT"
          echo "verdict=unreach" >> "$GITHUB_OUTPUT"
          {
            echo "## 源契约执行结果：全部不可达，非契约破坏"
            echo ""
            echo "两次 attempt 均失败，但失败原因全部属于「预探失败 / 网络不可达」"
            echo "（Exception / HTTP 错误码 / 连接被重置 / 超时）。"
            echo "GitHub runner 位于海外，访问国内源站天然 403/重置；实测同一条 URL"
            echo "从本机直连可返回 200 + JSON。故不开 issue（避免噪声训练），"
            echo "但 job 保留红色（P1-30：预探失败必须 fail）。"
            echo ""
            echo "### 不可达明细"
            echo '```'
            grep -oE '(预探失败|网络不可达)[^\n]*' "$LOG" | sort | uniq -c | head -20
            grep -oE '(ClientException|SocketException|TimeoutException|HttpStatusException)[^\n]*' "$LOG" | sort | uniq -c | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1



      - name: Open or refresh failure issue
        if: failure() && steps.contracts.outputs.verdict == 'drift'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7（钉 commit SHA，P1-29）
        with:
          script: |
            const title = '[source-health] 每日源契约失败';
            const day = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `每日真实网络契约连续两次失败（重试后仍失败）。`,
              ``,
              `- 日期：${day} (UTC)`,
              `- 运行：${runUrl}`,
              `- 触发：${{ github.event.inputs.reason || 'cron 定时' }}`,
              ``,
              `请按 run 日志里失败的 verify_*_test.dart 定位：`,
              `1. 打开失败的那个测试，看它断言的是哪个 URL / 选择器；`,
              `2. 手动访问源站确认改版点（路径、class、接口字段）；`,
              `3. 修 sources/ 下对应实现，本地跑：`,
              '   ```',
              '   flutter test test/verify_xxx_test.dart --dart-define=LIVE_SOURCE_TESTS=true',
              '   ```',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'source-health',
              per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `⚠️ 又失败一次（${day}）：${runUrl}`,
              });
              core.info(`commented on #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['source-health', 'bug'],
              });
              core.info(`created #${created.data.number}`);
            }