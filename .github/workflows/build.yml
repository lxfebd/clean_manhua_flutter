name: Build APK & Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.1.0），留空则用 pubspec 版本'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # action 默认 packages 是 'tools platform-tools'，但 SDK 26+ 已移除 legacy
          # "tools" 包（改名 cmdline-tools），action 仍硬编码该默认值 → sdkmanager
          # 报 "Failed to find package 'tools'" 并以 exit code 1 失败。显式覆盖默认值；
          # cmdline-tools 由下面 sdkmanager --licenses 所在步骤自行安装。
          packages: platform-tools

      - name: Install NDK & Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.2.13676358" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode signing key
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/xingmanxia.jks
            echo "storePassword=$STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=xingmanxia.jks" >> android/key.properties
            echo "✅ 签名密钥已配置"
          else
            echo "⚠️ 未配置签名密钥，使用 debug 签名"
          fi

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_HOME }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test -j4

      - name: Set app version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            echo "version=${V}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine build type
        id: buildtype
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            echo "type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: flutter build apk --${{ steps.buildtype.outputs.type }} --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      # 多架构拆分（release 仅）：arm64-v8a / armeabi-v7a / x86_64 独立包，
      # 体积从 ~145MB 单包降到 ~40MB 每架构，弱网下载友好。
      - name: Build split APKs (multi-arch)
        if: steps.buildtype.outputs.type == 'release'
        run: flutter build apk --release --split-per-abi --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.buildtype.outputs.type }}
          path: |
            build/app/outputs/flutter-apk/app-${{ steps.buildtype.outputs.type }}.apk
            build/app/outputs/flutter-apk/app-*-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 星漫匣 v${{ steps.version.outputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

  # ── 主分支内测包（Pre-release）────────────────────────────
  # 每次 push 到 main/master（非 tag）构建 debug APK 并发布到 Pre-release，
  # 供用户下载内测。功能与 release 构建共用 Android 环境，故独立轻量 job。
  # 注：默认分支是 main（master 为历史分支），两个都要覆盖，否则 nightly 永不触发。
  nightly:
    if: github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    # Publish Pre-release 步骤要创建 Release —— d18f455 的「permissions
    # cleanup」把这 job 的 contents: write 误删了，默认 token 只读，
    # softprops/action-gh-release 立刻 403（10-11 之后 nightly 全红的根因）。
    permissions:
      contents: write
    concurrency:
      group: nightly-debug-apk
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # action 默认 packages 是 'tools platform-tools'，但 SDK 26+ 已移除 legacy
          # "tools" 包（改名 cmdline-tools），action 仍硬编码该默认值 → sdkmanager
          # 报 "Failed to find package 'tools'" 并以 exit code 1 失败。显式覆盖默认值；
          # cmdline-tools 由下面 sdkmanager --licenses 所在步骤自行安装。
          packages: platform-tools

      - name: Install NDK & Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.2.13676358" "platforms;android-34" "build-tools;34.0.0"

      # 内测包与正式包**必须同签名**：build.gradle.kts 里 debug/release 都优先用
      # key.properties 指向的 release 签名。此前 nightly 没有这一步 —— 只在 tag
      # 构建时注入密钥，于是 main push 出的 debug APK 实际走的是 runner 的
      # debug 签名；用户装过 nightly 后再装 release 会报「应用未安装/签名不一致」，
      # 反之亦然。这里补齐注入，让 nightly 与 release 共用同一把发布密钥。
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/xingmanxia.jks
            echo "storePassword=$STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=xingmanxia.jks" >> android/key.properties
            echo "✅ 内测包已使用正式签名（与 release 包一致）"
          else
            echo "⚠️ 未配置签名密钥，内测包将使用 debug 签名（与 release 包不兼容）"
          fi

      - name: Pub get
        run: flutter pub get

      - name: Set app version
        id: version
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Publish Pre-release (debug)
        uses: softprops/action-gh-release@v2
        with:
          name: 内测版 v${{ steps.version.outputs.version }} (debug)
          tag_name: nightly-${{ github.sha }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-debug.apk
          generate_release_notes: true

  # ── Windows 电脑端（桌面版）构建 ──────────────────────────────────────
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_HOME }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Set app version
        id: version
        shell: bash
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Build Windows desktop
        run: flutter build windows --release --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Setup NSIS
        shell: pwsh
        run: |
          # NSIS 3.11 便携版（官方 SourceForge 项目文件），解压即用，无需管理员。
          # SourceForge 会 302 到随机镜像，runner 上偶发瞬断（Invoke-WebRequest 直接
          # OperationStopped）→ 改用 curl 自带重试，再外层套 5 次退避循环兜底。
          $nsisVersion = "3.11"
          $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$nsisVersion/nsis-$nsisVersion.zip"
          $ok = $false
          for ($i = 1; $i -le 5; $i++) {
            curl.exe -sSL --fail --retry 3 --retry-all-errors --max-time 180 -o nsis.zip $url
            if ($LASTEXITCODE -eq 0 -and (Get-Item nsis.zip -ErrorAction SilentlyContinue).Length -gt 1MB) { $ok = $true; break }
            Write-Host "NSIS download attempt $i failed, retrying in $($i * 5)s..."
            Start-Sleep -Seconds ($i * 5)
          }
          if (-not $ok) { throw "NSIS download failed after 5 attempts" }
          Expand-Archive -Path nsis.zip -DestinationPath . -Force
          $makensis = (Resolve-Path ".\nsis-$nsisVersion\makensis.exe").Path
          Add-Content $env:GITHUB_ENV "MAKENSIS=$makensis"
          Write-Host "makensis: $makensis"

      - name: Package Windows installer (NSIS exe)
        shell: pwsh
        run: |
          # makensis 只认 UTF-16LE 或纯 ASCII 脚本；仓库里存 UTF-8，先转码再编译。
          # -D 参数必须整体加引号：PowerShell 会把 -DAPP_VERSION=1.5.1 按点号拆成
          # "APP_VERSION=1" + ".5.1"，makensis 把 .5.1 当脚本名报 Can't open script。
          # 转码产物必须留在仓库根：NSIS 按“脚本所在目录”解析脚本内相对路径
          # （MUI_ICON windows\runner\resources\app_icon.ico / File build\windows\... /
          # OutFile 全相对仓库根），放 %TEMP% 会全部落空 → can't open file。
          $t = Get-Content -Raw -Encoding UTF8 windows/installer.nsi
          [IO.File]::WriteAllText("$PWD\installer_u16.nsi", $t, [Text.Encoding]::Unicode)
          & $env:MAKENSIS "-DAPP_VERSION=${{ steps.version.outputs.version }}" "$PWD\installer_u16.nsi"
          if ($LASTEXITCODE -ne 0) { Remove-Item "$PWD\installer_u16.nsi" -ErrorAction SilentlyContinue; exit $LASTEXITCODE }
          Remove-Item "$PWD\installer_u16.nsi" -ErrorAction SilentlyContinue
          Get-ChildItem xingmanxia-windows-*.exe

      - name: Package Windows zip (portable)
        shell: bash
        run: |
          V=${{ steps.version.outputs.version }}
          cd build/windows/x64/runner/Release
          powershell -NoProfile -Command "Compress-Archive -Path '*' -DestinationPath '..\..\..\..\..\xingmanxia-windows-$V.zip' -Force"
          ls -la ../../../../../xingmanxia-windows-$V.zip

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: |
            build/windows/x64/runner/Release/
            xingmanxia-windows-*-setup.exe
          if-no-files-found: error

      - name: Attach Windows build to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # 挂 exe 安装包 + zip 免安装包；app 内「检查更新」优先取 setup.exe
          # 静默覆盖安装（UpdateChecker.pickAssetForPlatform prefer '.exe'），
          # 旧 release 没打 exe 时回退 zip。
          files: xingmanxia-windows-*
