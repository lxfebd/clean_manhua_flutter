name: Build APK & Release

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.1.0），留空则用 pubspec 版本'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_HOME }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Set app version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            echo "version=${V}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine build type
        id: buildtype
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            echo "type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: flutter build apk --${{ steps.buildtype.outputs.type }} --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.buildtype.outputs.type }}
          path: build/app/outputs/flutter-apk/app-${{ steps.buildtype.outputs.type }}.apk

      # 临时：把 debug APK 分块推到 ci-apk 分支（GitHub 单文件推送上限 100MB，APK 约 145MB 需分块），
      # 之后经 raw.githubusercontent.com 取回各块本地合并，用于模拟器安装测试。
      # 同时把诊断信息写入 diag.txt 一并推送，便于沙箱经 raw 通道核查分块是否非空、推送是否成功。
      - name: Share debug APK to ci-apk branch (chunked)
        if: steps.buildtype.outputs.type == 'debug'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          {
            echo "PWD=$(pwd)"
            echo "APK exists: $([ -f "$APK" ] && echo yes || echo no)"
            echo "APK bytes: $(stat -c%s "$APK" 2>/dev/null || echo NA)"
            echo "--- split (50MB/块) ---"
            split -b 50000000 -d "$APK" apk.part. ; echo "split rc=$?"
            echo "--- ls chunks ---"
            ls -la apk.part.* 2>&1
            echo "--- wc chunks ---"
            wc -c apk.part.* 2>&1
          } > diag.txt 2>&1
          PARTS=($(ls apk.part.* 2>/dev/null))
          SHA=$(sha256sum "$APK" 2>/dev/null | cut -d' ' -f1)
          { echo "$SHA"; echo "${#PARTS[@]}"; for p in "${PARTS[@]}"; do echo "$p"; done; } > manifest.txt
          git config user.email "ci@local"
          git config user.name "ci"
          git config http.postBuffer 524288000
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/lxfebd/clean_manhua_flutter.git"
          git branch -D ci-apk 2>/dev/null || true
          git checkout --orphan ci-apk 2>&1 | tee -a diag.txt
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f apk.part.* manifest.txt diag.txt 2>&1 | tee -a diag.txt
          git ls-files --stage apk.part.* >> diag.txt 2>&1
          git commit -m "apk ${{ github.sha }} chunks=${#PARTS[@]} sha=$SHA" >> diag.txt 2>&1
          git push -f origin ci-apk >> diag.txt 2>&1
          echo "push rc=$?" >> diag.txt

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 星漫匣 v${{ steps.version.outputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
