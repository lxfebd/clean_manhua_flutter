name: Build APK & Release

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.1.0），留空则用 pubspec 版本'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # action 默认 packages 是 'tools platform-tools'，但 SDK 26+ 已移除 legacy
          # "tools" 包（改名 cmdline-tools），action 仍硬编码该默认值 → sdkmanager
          # 报 "Failed to find package 'tools'" 并以 exit code 1 失败。显式覆盖默认值；
          # cmdline-tools 由下面 sdkmanager --licenses 所在步骤自行安装。
          packages: platform-tools

      - name: Install NDK & Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode signing key
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/xingmanxia.jks
            echo "storePassword=$STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=xingmanxia.jks" >> android/key.properties
            echo "✅ 签名密钥已配置"
          else
            echo "⚠️ 未配置签名密钥，使用 debug 签名"
          fi

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_HOME }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Set app version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            echo "version=${V}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine build type
        id: buildtype
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            echo "type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: flutter build apk --${{ steps.buildtype.outputs.type }} --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      # 多架构拆分（release 仅）：arm64-v8a / armeabi-v7a / x86_64 独立包，
      # 体积从 ~145MB 单包降到 ~40MB 每架构，弱网下载友好。
      - name: Build split APKs (multi-arch)
        if: steps.buildtype.outputs.type == 'release'
        run: flutter build apk --release --split-per-abi --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.buildtype.outputs.type }}
          path: |
            build/app/outputs/flutter-apk/app-${{ steps.buildtype.outputs.type }}.apk
            build/app/outputs/flutter-apk/app-*-release.apk

      # 临时：把 debug APK 分块推到 ci-apk 分支（GitHub 单文件推送上限 100MB，APK 约 145MB 需分块），
      # 之后经 raw.githubusercontent.com 取回各块本地合并，用于模拟器安装测试。
      # 同时把诊断信息写入 diag.txt 一并推送，便于沙箱经 raw 通道核查分块是否非空、推送是否成功。
      - name: Share debug APK to ci-apk branch (chunked)
        if: steps.buildtype.outputs.type == 'debug'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          {
            echo "PWD=$(pwd)"
            echo "APK exists: $([ -f "$APK" ] && echo yes || echo no)"
            echo "APK bytes: $(stat -c%s "$APK" 2>/dev/null || echo NA)"
            echo "--- split (50MB/块) ---"
            split -b 50000000 -d "$APK" apk.part. ; echo "split rc=$?"
            echo "--- ls chunks ---"
            ls -la apk.part.* 2>&1
            echo "--- wc chunks ---"
            wc -c apk.part.* 2>&1
          } > diag.txt 2>&1
          PARTS=($(ls apk.part.* 2>/dev/null))
          SHA=$(sha256sum "$APK" 2>/dev/null | cut -d' ' -f1)
          { echo "$SHA"; echo "${#PARTS[@]}"; for p in "${PARTS[@]}"; do echo "$p"; done; } > manifest.txt
          git config user.email "ci@local"
          git config user.name "ci"
          git config http.postBuffer 524288000
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/lxfebd/clean_manhua_flutter.git"
          git branch -D ci-apk 2>/dev/null || true
          git checkout --orphan ci-apk 2>&1 | tee -a diag.txt
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f apk.part.* manifest.txt diag.txt 2>&1 | tee -a diag.txt
          git ls-files --stage apk.part.* >> diag.txt 2>&1
          git commit -m "apk ${{ github.sha }} chunks=${#PARTS[@]} sha=$SHA" >> diag.txt 2>&1
          git push -f origin ci-apk >> diag.txt 2>&1
          echo "push rc=$?" >> diag.txt

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 星漫匣 v${{ steps.version.outputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

  # ── 主分支内测包（Pre-release）────────────────────────────
  # 每次 push 到 master（非 tag）构建 debug APK 并发布到 Pre-release，
  # 供用户下载内测。功能与 release 构建共用 Android 环境，故独立轻量 job。
  nightly:
    if: github.ref_type == 'branch' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-debug-apk
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # action 默认 packages 是 'tools platform-tools'，但 SDK 26+ 已移除 legacy
          # "tools" 包（改名 cmdline-tools），action 仍硬编码该默认值 → sdkmanager
          # 报 "Failed to find package 'tools'" 并以 exit code 1 失败。显式覆盖默认值；
          # cmdline-tools 由下面 sdkmanager --licenses 所在步骤自行安装。
          packages: platform-tools

      - name: Install NDK & Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"

      - name: Pub get
        run: flutter pub get

      - name: Set app version
        id: version
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Publish Pre-release (debug)
        uses: softprops/action-gh-release@v2
        with:
          name: 内测版 v${{ steps.version.outputs.version }} (debug)
          tag_name: nightly-${{ github.sha }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-debug.apk
          generate_release_notes: true

  # ── Windows 电脑端（桌面版）构建 ──────────────────────────────────────
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_HOME }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Set app version
        id: version
        shell: bash
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Build Windows desktop
        run: flutter build windows --release --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Setup NSIS
        shell: pwsh
        run: |
          # NSIS 3.11 便携版（官方 SourceForge 项目文件），解压即用，无需管理员
          $nsisVersion = "3.11"
          $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$nsisVersion/nsis-$nsisVersion.zip"
          Invoke-WebRequest -Uri $url -OutFile nsis.zip
          Expand-Archive -Path nsis.zip -DestinationPath . -Force
          $makensis = (Resolve-Path ".\nsis-$nsisVersion\makensis.exe").Path
          Add-Content $env:GITHUB_ENV "MAKENSIS=$makensis"
          Write-Host "makensis: $makensis"

      - name: Package Windows installer (NSIS exe)
        shell: pwsh
        run: |
          # makensis 只认 UTF-16LE 或纯 ASCII 脚本；仓库里存 UTF-8，先转码再编译
          $t = Get-Content -Raw -Encoding UTF8 windows/installer.nsi
          [IO.File]::WriteAllText("$env:TEMP\installer_u16.nsi", $t, [Text.Encoding]::Unicode)
          & $env:MAKENSIS -DAPP_VERSION=${{ steps.version.outputs.version }} "$env:TEMP\installer_u16.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem xingmanxia-windows-*.exe

      - name: Package Windows zip (portable)
        shell: bash
        run: |
          V=${{ steps.version.outputs.version }}
          cd build/windows/x64/runner/Release
          powershell -NoProfile -Command "Compress-Archive -Path '*' -DestinationPath '..\..\..\..\..\xingmanxia-windows-$V.zip' -Force"
          ls -la ../../../../../xingmanxia-windows-$V.zip

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: |
            build/windows/x64/runner/Release/
            xingmanxia-windows-*-setup.exe
          if-no-files-found: error

      - name: Attach Windows build to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # 挂 exe 安装包 + zip 免安装包；app 内「检查更新」优先取 setup.exe
          # 静默覆盖安装（UpdateChecker.pickAssetForPlatform prefer '.exe'），
          # 旧 release 没打 exe 时回退 zip。
          files: xingmanxia-windows-*
